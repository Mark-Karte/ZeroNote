<!doctype html>
<!--
  Карточка для ссылок на репозиторий (Settings → General → Social preview):
  её показывают Telegram, Discord и другие, когда делятся ссылкой.
  1280×640 — размер, который просит GitHub. Язык — после решётки: #ru или #en.

  Пересобрать (из корня репозитория, безголовым Edge):
  msedge --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=1
         --window-size=1280,640 --screenshot=<png> file:///<путь>/docs/social-preview.html#en

  Цвета — от знака приложения: подложка #22242c → #101116, акцент — его
  черта, oklch(0.68 0.16 250) = #3b9cf6.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background:
      radial-gradient(900px 520px at 88% 30%, rgba(59, 156, 246, 0.16), transparent 70%),
      linear-gradient(160deg, #22242c 0%, #101116 100%);
    color: #f4f5f8;
    position: relative;
  }
  /* Колонка текста — одним потоком, плашки в нём же: строка о главном
     по-русски длиннее и переносится, и прибитое к низу наезжало на неё. */
  .text {
    position: absolute; left: 80px; top: 0; bottom: 0; width: 540px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .logo { width: 120px; height: 120px; border-radius: 28px; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08); }
  h1 { font-size: 92px; font-weight: 600; letter-spacing: -1.5px; margin: 24px 0 14px; line-height: 1; }
  .lead { font-size: 32px; line-height: 1.25; font-weight: 600; margin: 0 0 14px; color: #f4f5f8; text-wrap: balance; }
  .sub { font-size: 24px; line-height: 1.4; margin: 0; color: #a9adbb; text-wrap: balance; }
  .chips { display: flex; gap: 12px; margin-top: 30px; }
  .chip {
    font-size: 20px; font-weight: 600; padding: 7px 16px; border-radius: 999px;
    background: rgba(59, 156, 246, 0.14); color: #8cc3fc; border: 1px solid rgba(59, 156, 246, 0.35);
  }
  .shot {
    position: absolute; left: 660px; top: 92px; width: 760px; border-radius: 14px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.08);
  }
</style>
</head>
<body>
  <div class="text">
    <img class="logo" src="../icons/zeronote-dark-256.png" alt="">
    <h1>ZeroNote</h1>
    <p class="lead" data-en="Text and notes editor for Windows" data-ru="Редактор текста и заметок для Windows"></p>
    <p class="sub" data-en="Opens instantly, like Notepad++. Works with a folder as a project." data-ru="Открывается мгновенно, как Notepad++. С папкой работает как с проектом."></p>
    <div class="chips">
      <span class="chip">Markdown</span>
      <span class="chip">[[links]]</span>
      <span class="chip">Windows 10 · 11</span>
      <span class="chip">MIT</span>
    </div>
  </div>
  <img class="shot" src="screenshots/window-dark.png" alt="">
  <script>
    const lang = location.hash === '#ru' ? 'ru' : 'en';
    document.documentElement.lang = lang;
    for (const el of document.querySelectorAll('[data-en]')) el.textContent = el.dataset[lang];
  </script>
</body>
</html>
