# «Бумага» — основная светлая тема ZeroNote.
#
# Чтобы сделать свою тему: скопируйте этот файл в data/themes/, поменяйте id,
# name и цвета. Достаточно раздела [palette] — семантические роли (фон панелей,
# цвет текста, границы, тени) выводятся из него автоматически. Не заданное
# в палитре берётся из встроенной темы того же вида, так что тема из пяти
# строк тоже работает.
#
# id менять обязательно: тема с id встроенной подменяет её.

schema = 1
id = "light"
name = "Бумага"
appearance = "light"

[palette]
# Три слоя от дальнего к ближнему. В светлой теме подложка серая, а не белая:
# белые зазоры между белыми панелями не разделяли бы ничего.
bg-0 = "#e8eaef"          # подложка окна, видна в зазорах между панелями
bg-1 = "#f7f8fa"          # панели, шапка, вкладки, строка состояния
bg-2 = "#ffffff"          # рабочая область, всплывающие поверхности, диалоги
bg-3 = "#eceef4"          # наведение курсора
bg-4 = "#dfe3ea"          # нажатое состояние

# Текст от самого контрастного к самому тихому.
fg-0 = "#1b1f27"
fg-1 = "#535b6a"
fg-2 = "#8b93a3"
fg-on-accent = "#ffffff"

# Акцент темнее, чем в тёмной теме: тот же оттенок на белом фоне даёт 3:1
# и не годится для текста ссылок (Р-078).
accent = "#4c5fe0"
accent-hover = "#3a4ccc"
accent-soft = "rgba(76, 95, 224, 0.12)"        # активная строка, совпадение
accent-selection = "rgba(76, 95, 224, 0.22)"   # выделение текста

border = "#c7ccd6"
border-subtle = "#e1e4ea"

danger = "#c0392b"
warning = "#a15c00"
success = "#1b7f52"

# Подсветка синтаксиса. Шесть цветов на все языки: роли общие, а не
# «ключевое слово Rust» и «ключевое слово Python» по отдельности. Операторы,
# знаки препинания и заголовки markdown берут цвет из палитры выше (Р-082).
syn-keyword = "#7a45d6"    # ключевые слова
syn-string = "#1b7f52"     # строки и символьные литералы
syn-comment = "#98a0ad"    # комментарии
syn-number = "#8a6d1f"     # числа, константы вроде true и nil
syn-type = "#a65a12"       # типы, классы, перечисления
syn-function = "#2563c7"   # имена функций при объявлении и вызове

# Цвет теней. Геометрию задаёт слой токенов, тема отвечает только за плотность.
shadow-weak = "rgba(16, 24, 40, 0.10)"
shadow-strong = "rgba(16, 24, 40, 0.22)"

# Подложка под модальным окном и палитрой.
overlay = "rgba(24, 30, 42, 0.35)"
