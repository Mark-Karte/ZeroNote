# Встроенная светлая тема ZeroNote.
#
# Чтобы сделать свою тему: скопируйте этот файл в data/themes/, поменяйте id,
# name и цвета. Достаточно раздела [palette] — семантические роли
# (фон панелей, цвет текста, границы) выводятся из него автоматически.
#
# Базовая тема намеренно сдержанная и нейтральная: настраиваемость и красота —
# разные задачи, вторая относится к этапу полировки.

schema = 1
id = "light"
name = "Светлая"
appearance = "light"

[palette]
# Фоны от самого дальнего к самому близкому к пользователю.
bg-0 = "#ffffff"          # рабочая область
bg-1 = "#f5f6f8"          # панели, строка состояния
bg-2 = "#ffffff"          # всплывающие поверхности, диалоги
bg-3 = "#eaecf0"          # наведение курсора
bg-4 = "#dde1e7"          # нажатое состояние

# Текст от самого контрастного к самому тихому.
fg-0 = "#1a1e26"
fg-1 = "#5b6472"
fg-2 = "#8b93a1"
fg-on-accent = "#ffffff"

accent = "#2563eb"
accent-hover = "#1d4ed8"
accent-soft = "#dbe6fe"   # подложка выделения

border = "#d5dae1"
border-subtle = "#e7eaee"

danger = "#c62828"
warning = "#b45309"
success = "#15803d"

[shadow]
raised = "0 1px 2px rgba(16, 24, 40, 0.10)"
overlay = "0 8px 24px rgba(16, 24, 40, 0.16)"
