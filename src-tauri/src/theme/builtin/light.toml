# «GitHub Light» — светлая тема по умолчанию.
#
# Источник палитры: тема GitHub Light для VS Code и оформление github.com.
# © 2020 Primer, лицензия MIT.
# https://github.com/primer/github-vscode-theme
#
# Это адаптация, а не копия (Р-144). Что изменено против источника и почему:
#
# * подложка окна взята светлее, чем canvas.inset у источника: она же служит
#   подложкой блоку кода в markdown, и на слишком тёмной подложке цвета кода
#   перестают дотягивать до порога;
# * комментарий, лиловый и жёлтый опущены на три-четыре единицы светлоты —
#   на подложке блока кода они давали 4,0–4,5:1. Оттенок не тронут;
# * трёх слоёв фона, цветов видов файлов и состояний в источнике нет вовсе —
#   они выведены из его же нейтральных серых.
#
# Чтобы сделать свою тему: скопируйте этот файл в data/themes/, поменяйте id,
# name и цвета. Достаточно раздела [palette] — семантические роли (фон панелей,
# цвет текста, границы, тени) выводятся из него автоматически. Не заданное
# в палитре берётся из встроенной темы того же вида, так что тема из пяти
# строк тоже работает.
#
# id менять обязательно: тема с id встроенной подменяет её.

schema = 1
id = "light"
name = "GitHub Light"
appearance = "light"

[palette]
# Три слоя от дальнего к ближнему. В светлой теме подложка серая, а не белая:
# белые зазоры между белыми панелями не разделяли бы ничего. Но и уводить её
# глубоко нельзя — на ней же лежит блок кода в markdown.
bg-0 = "#eff2f5"          # подложка окна, подложка блока кода
bg-1 = "#f6f8fa"          # панели, шапка, вкладки, строка состояния
bg-2 = "#ffffff"          # рабочая область, всплывающие поверхности, диалоги
bg-3 = "#eaeef2"          # наведение курсора
bg-4 = "#dfe3e8"          # нажатое состояние

# Текст от самого контрастного к самому тихому.
fg-0 = "#1f2328"
fg-1 = "#656d76"
fg-2 = "#818a94"
fg-on-accent = "#ffffff"

# В светлой теме наведение — темнее, а не светлее: цвет и так тёмный.
accent = "#0969da"
accent-hover = "#0a58c2"
accent-soft = "rgba(9, 105, 218, 0.10)"        # активная строка, совпадение
accent-selection = "rgba(9, 105, 218, 0.20)"   # выделение текста

border = "#d0d7de"
border-subtle = "#e4e8ec"

danger = "#cf222e"
warning = "#956300"
success = "#177d36"

# Подсветка синтаксиса. Шесть цветов на все языки: роли общие, а не
# «ключевое слово Rust» и «ключевое слово Python» по отдельности. Операторы,
# знаки препинания и заголовки markdown берут цвет из палитры выше (Р-082).
#
# Каждый обязан читаться и на рабочей области, и на подложке блока кода,
# и все шесть — различаться между собой: это проверяет тест (Р-143).
syn-keyword = "#cf222e"    # ключевые слова
syn-string = "#0a3069"     # строки и символьные литералы
syn-comment = "#656e78"    # комментарии
syn-number = "#0550ae"     # числа, константы вроде true и nil
syn-type = "#953800"       # типы, классы, перечисления
syn-function = "#804edd"   # имена функций при объявлении и вызове

# Цвет теней. Геометрию задаёт слой токенов, тема отвечает только за плотность.
shadow-weak = "rgba(31, 35, 40, 0.10)"
shadow-strong = "rgba(31, 35, 40, 0.22)"

# Подложка под модальным окном и палитрой.
overlay = "rgba(31, 35, 40, 0.35)"
