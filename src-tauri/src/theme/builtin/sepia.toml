# «Сепия» — тёплая светлая тема для долгого чтения и письма.
#
# Устройство палитры и назначение ключей описаны в light.toml.

schema = 1
id = "sepia"
name = "Сепия"
appearance = "light"

[palette]
bg-0 = "#e6ded0"
bg-1 = "#f6f1e7"
bg-2 = "#fdfaf3"
bg-3 = "#ece5d7"
bg-4 = "#ded5c3"

fg-0 = "#2a2419"
fg-1 = "#5d5443"
fg-2 = "#8f8571"
fg-on-accent = "#fdfaf3"

# Акцент холодный, а вся тема тёплая: на бумажном фоне тёплый акцент
# сливался бы с цветом типов и не читался как «сюда можно нажать».
accent = "#1f6f6b"
accent-hover = "#175a56"
accent-soft = "rgba(31, 111, 107, 0.12)"
accent-selection = "rgba(31, 111, 107, 0.22)"

border = "#c6bba6"
border-subtle = "#e0d8c8"

danger = "#a33227"
warning = "#8f5312"
success = "#367036"

syn-keyword = "#8a4b9c"
syn-string = "#3f7a3f"
syn-comment = "#a19781"
syn-number = "#7d5a12"
syn-type = "#9a5b18"
syn-function = "#2e6ba8"

shadow-weak = "rgba(70, 55, 30, 0.12)"
shadow-strong = "rgba(70, 55, 30, 0.26)"

overlay = "rgba(50, 42, 28, 0.35)"
