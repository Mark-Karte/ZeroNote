# Встроенная тёмная тема ZeroNote.
#
# Чтобы сделать свою тему: скопируйте этот файл в data/themes/, поменяйте id,
# name и цвета. Достаточно раздела [palette] — семантические роли
# (фон панелей, цвет текста, границы) выводятся из него автоматически.
#
# Базовая тема намеренно сдержанная и нейтральная: настраиваемость и красота —
# разные задачи, вторая относится к этапу полировки.

schema = 1
id = "dark"
name = "Тёмная"
appearance = "dark"

[palette]
# Фоны от самого дальнего к самому близкому к пользователю.
bg-0 = "#16181d"          # рабочая область
bg-1 = "#1c1f26"          # панели, строка состояния
bg-2 = "#23272f"          # всплывающие поверхности, диалоги
bg-3 = "#2c313a"          # наведение курсора
bg-4 = "#363c47"          # нажатое состояние

# Текст от самого контрастного к самому тихому.
fg-0 = "#e6e9ee"
fg-1 = "#a8b0bd"
fg-2 = "#767e8c"
fg-on-accent = "#ffffff"

accent = "#4c8dff"
accent-hover = "#6ba0ff"
accent-soft = "#26344d"   # подложка выделения

border = "#363c47"
border-subtle = "#262b33"

danger = "#f2544b"
warning = "#e3a008"
success = "#3fb950"

# Подсветка синтаксиса. Восемь цветов на все языки: роли общие, а не
# «ключевое слово Rust» и «ключевое слово Python» по отдельности.
# Обычный текст в коде, знаки препинания и ссылки берутся из палитры выше.
syn-keyword = "#b48ce0"    # ключевые слова
syn-string = "#8fbf7f"     # строки и символьные литералы
syn-comment = "#6c7684"    # комментарии
syn-number = "#d9a05b"     # числа, константы вроде true и nil
syn-type = "#6cb6c9"       # типы, классы, перечисления
syn-function = "#74a7f0"   # имена функций при объявлении и вызове
syn-operator = "#c3cad6"   # операторы
syn-heading = "#7fb3ff"    # заголовки markdown

[shadow]
# Тёмной теме нужна более плотная тень, чем светлой: на тёмном фоне
# слабая тень просто не читается.
raised = "0 1px 2px rgba(0, 0, 0, 0.40)"
overlay = "0 8px 24px rgba(0, 0, 0, 0.55)"
