# «Графит» — основная тёмная тема ZeroNote.
#
# Чтобы сделать свою тему: скопируйте этот файл в data/themes/, поменяйте id,
# name и цвета. Достаточно раздела [palette] — семантические роли (фон панелей,
# цвет текста, границы, тени) выводятся из него автоматически. Не заданное
# в палитре берётся из встроенной темы того же вида, так что тема из пяти
# строк тоже работает.
#
# id менять обязательно: тема с id встроенной подменяет её.

schema = 1
id = "dark"
name = "Графит"
appearance = "dark"

[palette]
# Фоны от самого дальнего к самому близкому к пользователю.
bg-0 = "#0d0f14"          # рабочая область редактора
bg-1 = "#15181f"          # панели, шапка, строка состояния
bg-2 = "#1a1e26"          # всплывающие поверхности, диалоги, активная вкладка
bg-3 = "#232836"          # наведение курсора
bg-4 = "#2d3444"          # нажатое состояние

# Текст от самого контрастного к самому тихому.
fg-0 = "#e6e8ef"
fg-1 = "#a6adbe"
fg-2 = "#6b7387"
# Текст поверх заливки акцентом. Тёмный, а не белый: акцент светлый, и белым
# по нему получается 3:1 — ниже порога читаемости (Р-079).
fg-on-accent = "#0d0f14"

accent = "#7b8cff"
accent-hover = "#98a6ff"
# Полупрозрачные, а не сплошные: одна и та же подложка ложится и на панель,
# и на рабочую область, и в обоих случаях остаётся акцентом, а не пятном.
accent-soft = "rgba(123, 140, 255, 0.16)"       # активная строка, совпадение
accent-selection = "rgba(123, 140, 255, 0.30)"  # выделение текста

border = "#39404f"
border-subtle = "#262b33"

danger = "#ff7b72"
warning = "#e3b341"
success = "#7fd1a1"

# Подсветка синтаксиса. Шесть цветов на все языки: роли общие, а не
# «ключевое слово Rust» и «ключевое слово Python» по отдельности. Операторы,
# знаки препинания и заголовки markdown берут цвет из палитры выше (Р-082).
syn-keyword = "#b48eff"    # ключевые слова
syn-string = "#7fd1a1"     # строки и символьные литералы
syn-comment = "#5f6878"    # комментарии
syn-number = "#e5c07b"     # числа, константы вроде true и nil
syn-type = "#e8a05c"       # типы, классы, перечисления
syn-function = "#79b8ff"   # имена функций при объявлении и вызове

# Цвет теней. Геометрию задаёт слой токенов, тема отвечает только за плотность:
# на тёмном фоне слабая тень не читается вовсе.
shadow-weak = "rgba(0, 0, 0, 0.25)"
shadow-strong = "rgba(0, 0, 0, 0.55)"

# Подложка под модальным окном и палитрой.
overlay = "rgba(6, 8, 12, 0.55)"
