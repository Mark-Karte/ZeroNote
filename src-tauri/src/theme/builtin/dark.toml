# «One Dark» — тёмная тема по умолчанию.
#
# Источник палитры: One Dark, тема редактора Atom.
# © 2016 GitHub Inc., лицензия MIT.
# https://github.com/atom/one-dark-syntax
#
# Это адаптация, а не копия (Р-144). Что изменено против источника и почему:
#
# * цвет комментариев поднят с #5c6370 до #8b93a3. В источнике он даёт 2,3:1
#   на фоне редактора — ниже любого порога читаемости. Оттенок сохранён,
#   изменена только светлота;
# * числа взяты глубже: #d19a66 против #e5c07b у типов различались на ΔE 16,
#   то есть выглядели одним цветом. Стало #dd9046, ΔE 25;
# * цвет интерфейса (ссылки, выделение, рамка фокуса) — #6094ff: курсорный
#   синий One Dark #528bff, поднятый до 4,8:1, иначе ссылка в тексте
#   не читалась бы;
# * трёх слоёв фона, цветов видов файлов и состояний в источнике нет вовсе —
#   они выведены из его же фонов.
#
# Чтобы сделать свою тему: скопируйте этот файл в data/themes/, поменяйте id,
# name и цвета. Достаточно раздела [palette] — семантические роли (фон панелей,
# цвет текста, границы, тени) выводятся из него автоматически. Не заданное
# в палитре берётся из встроенной темы того же вида, так что тема из пяти
# строк тоже работает.
#
# id менять обязательно: тема с id встроенной подменяет её.

schema = 1
id = "dark"
name = "One Dark"
appearance = "dark"

[palette]
# Три слоя фона, от дальнего к ближнему (Р-083). Подложка окна видна только
# в зазорах между панелями и служит подложкой блоку кода в markdown; панели
# стоят на ней; рабочая область редактора лежит на панели.
bg-0 = "#1b1f27"          # подложка окна, подложка блока кода
bg-1 = "#21252b"          # панели, шапка, строка состояния
bg-2 = "#282c34"          # рабочая область редактора, диалоги, всплывающие
bg-3 = "#323842"          # наведение курсора
bg-4 = "#3e4451"          # нажатое состояние

# Текст от самого контрастного к самому тихому.
fg-0 = "#b9c0cd"
fg-1 = "#949cad"
fg-2 = "#767e8f"
# Текст поверх заливки акцентом. Тёмный, а не белый: акцент светлый, и белым
# по нему получается 3:1 — ниже порога читаемости (Р-079).
fg-on-accent = "#10131a"

accent = "#6094ff"
accent-hover = "#8fb0ff"
# Полупрозрачные, а не сплошные: одна и та же подложка ложится и на панель,
# и на рабочую область, и в обоих случаях остаётся акцентом, а не пятном.
accent-soft = "rgba(96, 148, 255, 0.16)"       # активная строка, совпадение
accent-selection = "rgba(96, 148, 255, 0.30)"  # выделение текста

border = "#3d4450"
border-subtle = "#2c313a"

danger = "#e5757e"
warning = "#e5c07b"
success = "#98c379"

# Подсветка синтаксиса. Шесть цветов на все языки: роли общие, а не
# «ключевое слово Rust» и «ключевое слово Python» по отдельности. Операторы,
# знаки препинания и заголовки markdown берут цвет из палитры выше (Р-082).
#
# Каждый обязан читаться и на рабочей области, и на подложке блока кода,
# и все шесть — различаться между собой: это проверяет тест (Р-143).
syn-keyword = "#c678dd"    # ключевые слова
syn-string = "#98c379"     # строки и символьные литералы
syn-comment = "#8b93a3"    # комментарии
syn-number = "#dd9046"     # числа, константы вроде true и nil
syn-type = "#e5c07b"       # типы, классы, перечисления
syn-function = "#61afef"   # имена функций при объявлении и вызове

# Цвет теней. Геометрию задаёт слой токенов, тема отвечает только за плотность:
# на тёмном фоне слабая тень не читается вовсе.
shadow-weak = "rgba(0, 0, 0, 0.28)"
shadow-strong = "rgba(0, 0, 0, 0.58)"

# Подложка под модальным окном и палитрой.
overlay = "rgba(10, 12, 18, 0.55)"
