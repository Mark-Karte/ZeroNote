# «Полночь» — тёмно-синяя тема. Тот же строй, что у «Графита», но фоны
# уведены в синеву, а контраст ниже: для работы вечером при выключенном свете.
#
# Устройство палитры и назначение ключей описаны в dark.toml.

schema = 1
id = "midnight"
name = "Полночь"
appearance = "dark"

[palette]
bg-0 = "#080b16"
bg-1 = "#0e1424"
bg-2 = "#121a2e"
bg-3 = "#1b2540"
bg-4 = "#243052"

fg-0 = "#e2e8f7"
fg-1 = "#9aa6c4"
fg-2 = "#5f6c8c"
fg-on-accent = "#080b16"

accent = "#8fa2ff"
accent-hover = "#a8b6ff"
accent-soft = "rgba(143, 162, 255, 0.16)"
accent-selection = "rgba(143, 162, 255, 0.30)"

border = "#2e3c60"
border-subtle = "#1c2540"

danger = "#ff8a80"
warning = "#f0c674"
success = "#6fd3b4"

syn-keyword = "#a78bfa"
syn-string = "#6fd3b4"
syn-comment = "#4f5a78"
syn-number = "#f2c98a"
syn-type = "#f0a85e"
syn-function = "#6fa8ff"

shadow-weak = "rgba(0, 0, 0, 0.35)"
shadow-strong = "rgba(0, 0, 0, 0.65)"

overlay = "rgba(3, 5, 12, 0.60)"
