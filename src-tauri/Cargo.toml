[package]
name = "zeronote"
version = "0.1.0"
description = "ZeroNote — редактор текста и заметок"
authors = ["Mark Karte", "Claude (Anthropic)"]
license = "MIT"
edition = "2024"
rust-version = "1.85"

[lib]
# `tauri build` собирает бинарник из main.rs, а вся логика живёт в библиотеке.
# Разделение нужно для тестов: интеграционные тесты в tests/ подключают
# библиотеку как обычный крейт и работают без запуска приложения.
name = "zeronote_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Формат настроек и тем — TOML (решение Р-003): нужны комментарии в файлах,
# которые правятся руками и кладутся в git. Свой парсер TOML не пишем.
toml = "0.9"
# Кодировщики и декодировщики однобайтовых кодировок и UTF-16. Реализация
# из Firefox, без транзитивных зависимостей. Своими руками это таблица на
# каждую кодовую страницу плюс корректная работа с суррогатами UTF-16.
# Определением кодировки занимается наш собственный код — см. text/detect.rs.
encoding_rs = "0.8"

[target.'cfg(windows)'.dependencies]
# ReplaceFileW для атомарной замены файла с сохранением прав и атрибутов
# приёмника (решение Р-006). std::fs::rename использует MoveFileEx и права
# приёмника теряет, то есть инвариант 3 не выполняет.
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[profile.release]
# Скорость важнее размера: цели по производительности — часть спецификации.
opt-level = 3
# Одна единица кодогенерации + LTO дают заметный выигрыш на старте за счёт
# лучшей инлайн-оптимизации. Платим временем сборки, а не временем работы.
codegen-units = 1
lto = true
strip = true
# panic = "abort" сознательно НЕ включён: паника в обработчике команды не должна
# убивать процесс вместе с несохранёнными черновиками (инвариант 4).
