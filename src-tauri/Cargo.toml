[package]
name = "zeronote"
version = "0.5.1"
description = "ZeroNote — редактор текста и заметок"
authors = ["Mark Karte", "Claude (Anthropic)"]
license = "MIT"
edition = "2024"
rust-version = "1.85"

[lib]
# `tauri build` собирает бинарник из main.rs, а вся логика живёт в библиотеке.
# Разделение нужно для тестов: интеграционные тесты в tests/ подключают
# библиотеку как обычный крейт и работают без запуска приложения.
name = "zeronote_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Формат настроек и тем — TOML (решение Р-003): нужны комментарии в файлах,
# которые правятся руками и кладутся в git. Свой парсер TOML не пишем.
toml = "0.9"
# Кодировщики и декодировщики однобайтовых кодировок и UTF-16. Реализация
# из Firefox, без транзитивных зависимостей. Своими руками это таблица на
# каждую кодовую страницу плюс корректная работа с суррогатами UTF-16.
# Определением кодировки занимается наш собственный код — см. text/detect.rs.
encoding_rs = "0.8"
# Системные диалоги открытия и сохранения файла. Своими руками это либо
# собственный файловый обозреватель (отдельный продукт), либо прямой вызов
# IFileDialog через FFI — много unsafe ради того, что уже сделано.
tauri-plugin-dialog = "2.7"
# Правила игнорирования в семантике .gitignore и обход дерева с их учётом
# (решения Р-043, Р-050). Своя реализация — это порядок применения правил,
# отрицания, привязка шаблона к каталогу и вложенные .gitignore. Ошибка в любом
# из этих мест даёт файл, который виден в дереве, но отсутствует в индексе.
# На этапе 2 отсюда нужен и обход папки (задача 10).
ignore = "0.4"
# Подписка на изменения файловой системы (решения Р-014, Р-043). На Windows
# это ReadDirectoryChangesW с перекрытым вводом-выводом: своими руками —
# отдельный поток с портом завершения, разбор буфера переменной длины и
# аккуратное закрытие дескриптора при снятии наблюдения. Опрос вместо
# подписки на дереве в десятки тысяч файлов не годится: он и есть тот самый
# фоновый обход, которого мы избегаем.
notify = "8"
# Полнотекстовый индекс (решение Р-043). FTS5 — это токенизатор, обратный
# индекс, ранжирование и отрывки с подсветкой; своими руками это отдельный
# продукт. `bundled` собирает SQLite из исходников вместе с приложением:
# системной библиотеки на машине пользователя может не быть, а версия той,
# что есть, — не наша забота.
rusqlite = { version = "0.37", features = ["bundled"] }
# Обновление из GitHub (решение Р-118). Своими руками это не «скачать файл»:
# это проверка подписи minisign, а криптографию своими руками не пишут —
# ошибка в ней означает, что приложение установит чужой пакет. Плюс запуск
# установщика NSIS с правильными ключами и корректный выход из процесса,
# который сам себя заменяет.
tauri-plugin-updater = "2"
# Правка TOML с сохранением комментариев, порядка ключей и форматирования
# (решения Р-013, Р-077). Обычный `toml` через serde этого не умеет: он
# пересобирает документ из структуры, и первая же запись из окна параметров
# стёрла бы пояснения пользователя — то же самое, чего мы не делаем с чужими
# файлами по инварианту 1. Тот же крейт использует cargo для правки Cargo.toml.
toml_edit = "0.25"

[target.'cfg(windows)'.dependencies]
# ReplaceFileW для атомарной замены файла с сохранением прав и атрибутов
# приёмника (решение Р-006). std::fs::rename использует MoveFileEx и права
# приёмника теряет, то есть инвариант 3 не выполняет.
# Плюс чтение буфера обмена (решение Р-109): браузерное readText в WebView2
# не отвечает вовсе, а брать ради пяти системных вызовов отдельный крейт
# с поддержкой картинок и трёх операционных систем — дороже, чем написать
# эти пять вызовов.
windows-sys = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    # Удаление в корзину (Р-110): SHFileOperationW и SHQueryRecycleBin.
    "Win32_UI_Shell",
] }

[profile.release]
# Скорость важнее размера: цели по производительности — часть спецификации.
opt-level = 3
# Одна единица кодогенерации + LTO дают заметный выигрыш на старте за счёт
# лучшей инлайн-оптимизации. Платим временем сборки, а не временем работы.
codegen-units = 1
lto = true
strip = true
# panic = "abort" сознательно НЕ включён: паника в обработчике команды не должна
# убивать процесс вместе с несохранёнными черновиками (инвариант 4).
