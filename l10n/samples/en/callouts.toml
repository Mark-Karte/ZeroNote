# ZeroNote callouts.
#
# A callout is a quote whose first line is written like this: > [!type] Title.
# Obsidian draws it as a card, and so does ZeroNote. This file says which
# types exist, what icon and color each has and what title inserting puts
# into the note. It is easier to edit on the "Callouts" tab of the settings,
# but everything is visible here too.
#
#   id    — the type as written in the note: [!tip]. No spaces or brackets.
#   title — the title that inserting writes after the type. It is note text:
#           Obsidian will see it too.
#   icon  — the icon: a name from the list on the "Callouts" tab.
#   color — the color: a theme role — "accent", "success", "warning", "danger",
#           "muted", "keyword", "string", "number", "type", "function" —
#           or your own "#rrggbb". A role changes with the theme and is always
#           readable; your own color is your responsibility.
#
# A type that isn't here is drawn as "note".

schema = 1

[[callout]]
id = "note"
title = "Note"
icon = "md.callout-pencil"
color = "accent"

[[callout]]
id = "info"
title = "Info"
icon = "md.callout-note"
color = "accent"

